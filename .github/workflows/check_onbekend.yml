name: Check Onbekend

on:
  schedule:
    - cron: '0 0 * * 0' # Elke zondag 00:00 UTC (= 01:00 wintertijd / 02:00 zomertijd NL)
  workflow_dispatch: # Hiermee kun je het script handmatig starten

jobs:
  check-onbekend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests openpyxl

      - name: Run check onbekend
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL_ONBEKEND }}
        run: python extra_scripts/check_onbekend.py
