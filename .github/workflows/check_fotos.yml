name: Check Foto's

on:
  schedule:
    - cron: '30 0 * * 0' # Elke zondag 00:30 UTC, na Check Onbekend
  workflow_dispatch: # Hiermee kun je het script handmatig starten

jobs:
  check-fotos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests openpyxl

      - name: Run check foto's
        env:
          # Eigen kanaal als DISCORD_WEBHOOK_URL_FOTOS bestaat, anders het kanaal van Check Onbekend
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL_FOTOS || secrets.DISCORD_WEBHOOK_URL_ONBEKEND }}
        run: python extra_scripts/check_fotos.py

      - name: Upload rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fotocontrole
          path: |
            fotocontrole_*.xlsx
            fotocontrole_*.md
          if-no-files-found: ignore
