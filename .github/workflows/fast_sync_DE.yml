name: Fast Sync BE

on:
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false
  queue: max
  
jobs:
  run-script:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Amsterdam
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run script
        run: |
          git pull
          python compare_hulpdienstvoertuigenbenelux.py DE

      - name: Commit and push changes
        run: |
          git add .
          git reset updates.json
          git diff --cached --quiet || (git commit -m "Automated update from GitHub Actions" && git push)

      - name: Send Discord notification
        run: |
          curl -H "Content-Type: application/json" \
               -H "User-Agent: DiscordBot (https://github.com, 1.0)" \
               -d '{"content": "Fast sync BE has been performed."}' \
               "${{ secrets.DISCORD_WEBHOOK_URL_ICT }}"
