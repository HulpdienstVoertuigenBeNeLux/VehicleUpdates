name: Luchtvaartdata ophalen

on:
  schedule:
    # Draait elke maandag om 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch: # Zorgt ervoor dat je de workflow ook handmatig kunt starten via het GitHub dashboard

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
    - name: Code ophalen uit repository
      uses: actions/checkout@v4

    - name: Python instellen
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Afhankelijkheden installeren
      run: |
        python -m pip install --upgrade pip
        pip install pandas requests beautifulsoup4 odfpy

    - name: Script uitvoeren
      run: python get_luchtvaartdata.py

    - name: Wijzigingen (alle bestanden in storage) committen en pushen
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add storage/
        git commit -m "Automated update: ILT register & MMTL aircraft data" || exit 0
        # master kan tijdens de run veranderd zijn: eerst bijwerken, dan pushen
        for i in 1 2 3; do
          git pull --rebase --autostash && git push && exit 0
          sleep 15
        done
        exit 1
